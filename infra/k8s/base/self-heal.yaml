apiVersion: v1
kind: ServiceAccount
metadata:
  name: self-heal
  namespace: reliable-app
  labels:
    app.kubernetes.io/name: self-heal
    app.kubernetes.io/part-of: reliable-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: self-heal
  namespace: reliable-app
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: self-heal
  namespace: reliable-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: self-heal
subjects:
  - kind: ServiceAccount
    name: self-heal
    namespace: reliable-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-heal
  namespace: reliable-app
  labels:
    app.kubernetes.io/name: self-heal
    app.kubernetes.io/part-of: reliable-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: self-heal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: self-heal
        app.kubernetes.io/part-of: reliable-app
    spec:
      serviceAccountName: self-heal
      containers:
        - name: self-heal
          image: reliable-app/self-heal:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: NAMESPACE
              value: reliable-app
            - name: TARGET_DEPLOYMENT
              value: payments-mock
            - name: PAYMENTS_URL
              value: http://payments-mock:8000
            - name: EVIDENCE_DIR
              value: /evidence
            - name: SELF_HEAL_COOLDOWN_S
              value: "60"
          volumeMounts:
            - name: evidence
              mountPath: /evidence
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: evidence
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: self-heal
  namespace: reliable-app
  labels:
    app.kubernetes.io/name: self-heal
    app.kubernetes.io/part-of: reliable-app
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: self-heal
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30085
