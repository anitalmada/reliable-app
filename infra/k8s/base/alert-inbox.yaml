apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-inbox
  namespace: reliable-app
  labels:
    app.kubernetes.io/name: alert-inbox
    app.kubernetes.io/part-of: reliable-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-inbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-inbox
        app.kubernetes.io/part-of: reliable-app
    spec:
      containers:
        - name: alert-inbox
          image: reliable-app/alert-inbox:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: alert-inbox
  namespace: reliable-app
  labels:
    app.kubernetes.io/name: alert-inbox
    app.kubernetes.io/part-of: reliable-app
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: alert-inbox
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30084
