apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: reliable-app
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: reliable-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-api
        app.kubernetes.io/part-of: reliable-app
    spec:
      containers:
        - name: checkout-api
          image: reliable-app/checkout-api:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg2://checkout:checkout@postgres:5432/checkout
            - name: PAYMENTS_URL
              value: http://payments-mock:8000
            - name: PAYMENTS_TIMEOUT_S
              value: "5"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: reliable-app
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: reliable-app
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: checkout-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30082
