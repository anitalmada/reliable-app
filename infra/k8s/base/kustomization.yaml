apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: reliable-app

resources:
  - namespace.yaml
  - postgres.yaml
  - catalog-api.yaml
  - checkout-api.yaml
  - payments-mock.yaml
  - prometheus.yaml

configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus/prometheus.yml
      - prometheus/recording_rules.yml

generatorOptions:
  disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/part-of: reliable-app
    includeSelectors: false
