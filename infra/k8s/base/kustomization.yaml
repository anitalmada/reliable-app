apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: reliable-app

resources:
  - namespace.yaml
  - postgres.yaml
  - catalog-api.yaml
  - checkout-api.yaml
  - payments-mock.yaml
  - prometheus.yaml
  - grafana.yaml
  - alertmanager.yaml
  - alert-inbox.yaml
  - self-heal.yaml

configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus/prometheus.yml
      - prometheus/recording_rules.yml
      - prometheus/alert_rules.yml
  - name: alertmanager-config
    files:
      - alertmanager.yml=alertmanager/alertmanager.yml
  - name: grafana-datasources
    files:
      - datasource.yml=grafana/provisioning/datasources/datasource.yml
  - name: grafana-dashboard-provider
    files:
      - dashboards.yml=grafana/provisioning/dashboards/dashboards.yml
  - name: grafana-dashboards
    files:
      - executive.json=grafana/dashboards/executive.json
      - triage.json=grafana/dashboards/triage.json
      - infra.json=grafana/dashboards/infra.json

generatorOptions:
  disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/part-of: reliable-app
    includeSelectors: false
