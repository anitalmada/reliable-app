global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/recording_rules.yml

scrape_configs:
  - job_name: catalog-api
    metrics_path: /metrics
    static_configs:
      - targets: ["catalog-api:8000"]

  - job_name: checkout-api
    metrics_path: /metrics
    static_configs:
      - targets: ["checkout-api:8000"]

  - job_name: payments-mock
    metrics_path: /metrics
    static_configs:
      - targets: ["payments-mock:8000"]
