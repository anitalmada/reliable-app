kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: reliable-app
nodes:
  - role: control-plane
    extraPortMappings:
      # Host -> Kind node NodePorts (see Services in base/)
      - containerPort: 30081
        hostPort: 8081
        protocol: TCP
      - containerPort: 30082
        hostPort: 8082
        protocol: TCP
      - containerPort: 30083
        hostPort: 8083
        protocol: TCP
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
